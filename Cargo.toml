[package]
name = "rust-petitparser"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["rust-petitparser-macros"]
resolver = "3"

[dependencies]
regex = "1.12.4"
rust-petitparser-macros = { path = "rust-petitparser-macros" }

[dev-dependencies]
googletest = { version = "0.14.2", features = ["proptest"] }
proptest = "1.11.0"
ureq = "3.3.0"
criterion = "0.8.2"

[[bench]]
name = "parse_grammars"
harness = false
